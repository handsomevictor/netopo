[package]
name = "netopo"
version = "0.1.0"
edition = "2021"
description = "Local network topology mapper — scan devices, track connections, visualize graphs"
license = "MIT"
repository = "https://github.com/yourusername/netopo"
keywords = ["network", "topology", "scanner", "cli", "tui"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "netopo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
pnet = "0.34"
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
dns-lookup = "2"
ipnet = "2"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["iphlpapi", "winsock2"] }

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
